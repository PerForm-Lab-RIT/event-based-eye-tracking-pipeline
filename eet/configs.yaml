# This file contains the configurations for the event-based eye tracking pipeline.
defaults:
  logroot: logs
  logdir: ''
  expname: 'dummy'
  seed: 0
  log_video_render: True # log the render of the envs
  replicas: 1

  logger:
    outputs: [jsonl, tensorboard]
    filter: 'score|length|fps|ratio|train/loss/|train/rand/'
    timer: True
    fps: 15
    user: ''

  jax:
    platform: cuda
    compute_dtype: bfloat16 # float32 # bfloat16
    prealloc: True
    jit: True
    debug: False
    enable_policy: True
    compile: True
    profiler: False
    gpuflags: True

  run:
    steps: 50000 # training steps
    eval_steps: 1e4 # 10k steps
    log_every: 15 # 10 seconds
    report_every: 30 # 5 minutes
    save_every: 100 # 100 seconds
    report_batches: 1 # number of batches to take to do reports
    from_checkpoint: ''
    actor_addr: 'localhost:{auto}'
    replay_addr: 'localhost:{auto}'
    logger_addr: 'localhost:{auto}'
    actor_batch: -1
    actor_threads: 1
    agent_process: False
    remote_replay: False
    remote_envs: False
    usage: {psutil: True, nvsmi: True, gputil: False, malloc: False, gc: False}
    debug: True # for using parallel environments (False) or not (True)

  task: threeet # NOTE: This has to be a list of different dataset because we want to train on multiple dataset, but for now, we only have one dataset
  env:
    threeet: { datadir: 'data/event-based-eye-tracking-ais2024', event_transform: eventframe, image_size: [640, 480] }
    eveye: { datadir: 'data/eveye', event_transform: eventframe, image_size: [640, 480] }

  # Related environmental and logging setup
  n_envs: 4
  batch_size: 32 # number of samples per batch
  batch_length: 64 # number of steps to take per batch
  report_length: 32
  replay_context: 1 # number of steps to look back for replay
  consec_train: 1 # number of batches to train per step
  consec_report: 1
  report: True

  # Replay
  replay:
    size: 50000 # 50000 is enough
    online: True
    fracs: {uniform: 1.0, priority: 0.0, recency: 0.0}
    prio: {exponent: 0.8, maxfrac: 0.5, initial: inf, zero_on_sample: True}
    priosignal: model
    recexp: 1.0
    chunksize: 1024

  # Agent Setup
  agent: dummy

  # Model and Networks Setup
  encoder:
    prockeys: '.*'
    cnn: {depth: 16, mults: [2, 3, 3, 4, 4, 4, 4], layers: 1, units: 16, act: silu,
      norm: layer, winit: trunc_normal_in, symlog: True, outer: False, kernel: 5, strided: True}
    cbconvlstm: {depth: 16, mults: [2, 3, 3, 4, 4, 4, 4], layers: 1, units: 16, act: silu,
      norm: layer, winit: trunc_normal_in, symlog: True, outer: False, kernel: 5, strided: True}

  dynamics:
    mlp: {space: 64, dist: 'normal_logstd', units: 64, layers: 2, act: silu, bias: True, winit: trunc_normal, binit: zeros, norm: rms} # a single mlp with output distribution
    gru: {units: 64, bias: True, winit: trunc_normal, binit: zeros, norm: rms, update_bias: -1.0}
    mamba: {deter: 16, units: 64, kernel: 4, expand: 16, bias: True, winit: trunc_normal, binit: zeros}
    rssm: {units: 64, stoch: 64, deter: 64}

  decoder:
    prockeys: '.*'
    cnn: {units: 64, norm: rms, act: silu, outscale: 1.0, depth: 64,
      mults: [2, 3, 3, 4, 4, 4, 4], layers: 3, kernel: 5, symlog: True,
      bspace: 8, outer: False, strided: False, bias: True, winit: trunc_normal, binit: zeros}

  head:
    general: {units: 64, layers: 2, act: silu, norm: layer, minstd: 1.0, maxstd: 1.0, unimix: 0.0,
      bins: 255, outscale: 1.0, bias: True, winit: trunc_normal, binit: zeros}

  # Optimizer configs
  opt: {lr: 6e-5, agc: 0.3, eps: 1e-20, beta1: 0.9, beta2: 0.999, nesterov: False, wd: 0.0, wdregex: r'/kernel$', schedule: const, warmup: 1000, anneal: 0}

  # Configurations of various hyperparameters



#============================ Environment Primitives ======================
3et_80x60:
  task: threeet
  env.threeet.datadir: 'data/event-based-eye-tracking-ais2024'
  env.threeet.image_size: [80, 60]
  .*\.mults: [2, 3, 3, 4]
  encoder.prockeys: 'frame'
  decoder.prockeys: 'frame'


3et_160x120:
  task: threeet
  env.threeet.datadir: 'data/event-based-eye-tracking-ais2024'
  env.threeet.image_size: [160, 120]
